; =====================================================================
;  Smart Farm Dual Zone — PlatformIO
;  บอร์ด: Waveshare ESP32-S3-POE-ETH-8DI-8RO (Flash 16MB)
;
;  โค้ดยังอยู่ที่โฟลเดอร์ SMART_FARM_DUAL_ZONE/ เหมือนเดิม
;  (เปิดด้วย Arduino IDE ได้ตามปกติ — PlatformIO แค่ชี้ src_dir ไปที่นั่น)
;
;  คำสั่งที่ใช้บ่อย (Terminal ใน VS Code):
;    pio run                  คอมไพล์
;    pio run -t upload        คอมไพล์ + อัปโหลดลงบอร์ด
;    pio device monitor       ดู Serial log
;    pio run -t erase         ล้าง Flash ทั้งหมด (ค่าใน NVS หายด้วย!)
; =====================================================================

[platformio]
src_dir = SMART_FARM_DUAL_ZONE
default_envs = smartfarm

[env:smartfarm]
platform = espressif32 @ 6.9.0          ; Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4)
board = esp32-s3-devkitc-1
framework = arduino

; ---------- Flash 16MB + พาร์ทิชันเดียวกับ Arduino IDE "16M Flash (3MB APP/9.9MB FATFS)" ----------
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_qspi

; ---------- USB CDC On Boot: Enabled (Serial ออกทางพอร์ต USB ของ ESP32-S3) ----------
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5     ; โค้ดใช้ StaticJsonDocument (API ของ v6)

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
